# Regenerates the contribution snake and the activity card daily and pushes
# both to the `output` branch, which the README's Activity section links to.
#
# The activity card comes from scripts/gen_stats.py rather than
# github-readme-stats, whose public instance is DEPLOYMENT_PAUSED (503).
#
# Ordering and error handling matter here: the stats card is generated FIRST,
# and the snake step is allowed to fail. Platane/snk hits the GitHub scraping
# endpoint and is the flakiest part of this job — when it aborted, it took the
# publish step with it and stats.svg never reached the `output` branch, which
# is what left the README's Activity section a broken image.
#
# One-time setup: Repo Settings → Actions → General → Workflow permissions
#                 → select "Read and write permissions" → Save.

name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

# A scheduled run and a push run racing each other would both force-push
# `output`; let the newer one win instead.
concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity card
        run: python3 scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
          STATS_OUT: dist/stats.svg

      # Allowed to fail: a flaky snake must not cost us the activity card.
      - name: Generate snake SVGs
        id: snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Verify artefacts
        run: |
          ls -la dist
          test -s dist/stats.svg || { echo "::error::stats.svg missing or empty"; exit 1; }
          if [ "${{ steps.snake.outcome }}" != "success" ]; then
            echo "::warning::snake generation failed; keeping the previously published copy"
          fi

      # keep_files so a step that failed this run leaves the last good file in
      # place on `output` rather than deleting it from the README.
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job on purpose: assets/*.svg are generated, so a hand-edit to them
  # would be silently reverted by the next generator run. Worth failing loudly
  # about — but not worth blocking the daily asset refresh over, which is why
  # this does not gate `build`.
  cards-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate cards and diff
        run: |
          python3 scripts/gen_cards.py
          git diff --exit-code --stat assets/ || {
            echo "::error::assets/*.svg differ from scripts/gen_cards.py output."
            echo "Run 'python3 scripts/gen_cards.py' and commit the result."
            exit 1
          }
