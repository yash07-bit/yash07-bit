# Regenerates the contribution snake and the stats card daily, and pushes
# both to an `output` branch, which the README links to.
#
# The stats card is generated by scripts/gen_stats.py instead of using
# github-readme-stats, whose public instance is DEPLOYMENT_PAUSED (503).
#
# One-time setup: Repo Settings → Actions → General → Workflow permissions
#                 → select "Read and write permissions" → Save.

name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate stats card
        run: python3 scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
          STATS_OUT: dist/stats.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
