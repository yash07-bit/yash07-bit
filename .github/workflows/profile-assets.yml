# Regenerates the contribution snake daily and pushes it to the `output`
# branch, which the README's activity section links to.
#
# The old self-hosted stats card was retired in the redesign: the README now
# carries its weight with projects, and a streak counter reading "1" says less
# than the work does. scripts/gen_stats.py is in git history if it's wanted back.
#
# One-time setup: Repo Settings → Actions → General → Workflow permissions
#                 → select "Read and write permissions" → Save.

name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

# A scheduled run and a push run racing each other would both force-push
# `output`; let the newer one win instead.
concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Platane/snk scrapes the contribution calendar and is occasionally
      # flaky. If it fails, the job fails before publishing, so the last good
      # SVGs stay on `output` and the README never shows a broken image.
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Verify artefacts
        run: |
          ls -la dist
          test -s dist/snake-light.svg && test -s dist/snake-dark.svg

      # keep_files so anything else already on `output` is left in place.
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # assets/hero.svg is generated, so a hand-edit to it would be silently
  # reverted by the next generator run. Fail loudly about drift instead.
  hero-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate hero and diff
        run: |
          python3 scripts/gen_hero.py
          git diff --exit-code --stat assets/ || {
            echo "::error::assets/hero.svg differs from scripts/gen_hero.py output."
            echo "Run 'python3 scripts/gen_hero.py' and commit the result."
            exit 1
          }
