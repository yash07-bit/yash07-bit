<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#D8D4CC" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A36"/>
      <stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#F3F0E8"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#111111" stroke-width="2"/>

  <text x="44" y="42" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#111111">STACK // YASH #07</text>
  <text x="1156" y="42" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#66615A">SYSTEM SPEC</text>

  <rect x="44" y="66" width="44" height="5" rx="2" fill="url(#accent)"/>

  <text x="44" y="128" font-family="monospace" font-size="11" letter-spacing="2" fill="#5F5A53">FRONTEND</text>
  <text x="44" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">React · Next.js · TypeScript · JavaScript</text>

  <text x="44" y="206" font-family="monospace" font-size="11" letter-spacing="2" fill="#5F5A53">BACKEND</text>
  <text x="44" y="236" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">Node.js · Express · FastAPI · Celery</text>

  <rect x="860" y="102" width="280" height="120" rx="10" fill="#111111"/>
  <text x="880" y="132" font-family="monospace" font-size="10" letter-spacing="2" fill="#A7A39C">DATA</text>
  <text x="880" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F3F0E8">MongoDB · PostgreSQL</text>
  <text x="880" y="188" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F3F0E8">MySQL · Redis</text>

  <line x1="44" y1="262" x2="1156" y2="262" stroke="#111111" stroke-width="1"/>
  <text x="44" y="282" font-family="monospace" font-size="11" letter-spacing="2" fill="#111111">BUILD → BREAK → ITERATE → SHIP</text>
