  <text x="338" y="182" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#111111">16</text>
  <text x="338" y="208" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#66615A">ACTIVE SYSTEMS</text>

  <rect x="592" y="98" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
